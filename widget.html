<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QLD 위젯</title>
<style>
  :root{
    --card:#ffffff; --border:#e5e7eb; --tile:#f7f8fa;
    --t1:#111827; --t2:#4b5563; --t3:#9ca3af;
    --blue:#2563eb; --blue-lt:#eff4ff;
    --green:#059669; --green-lt:#ecfdf5;
    --amber:#d97706; --amber-lt:#fffbeb;
    --red:#dc2626;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,'Noto Sans KR',Roboto,sans-serif;
    background:transparent; color:var(--t1);
    display:flex; align-items:flex-start; padding:2px 6px 6px;
    cursor:pointer; user-select:none;
  }
  .wrap{
    flex:1; background:var(--card); border:1px solid var(--border);
    border-radius:16px; box-shadow:0 3px 14px rgba(0,0,0,0.07);
    padding:10px 12px; display:flex; flex-direction:column; gap:9px; overflow:hidden;
  }
  .head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .mode{
    display:inline-flex; align-items:baseline; gap:6px;
    font-size:clamp(15px,4.6vw,20px); font-weight:900; line-height:1;
    padding:6px 12px; border-radius:10px; white-space:nowrap;
  }
  .mode .sub{font-size:11px; font-weight:800; opacity:.8;}
  .mode.hold {background:var(--blue-lt);  color:var(--blue);}
  .mode.buy  {background:var(--green-lt); color:var(--green);}
  .mode.watch{background:var(--amber-lt); color:var(--amber);}
  .mode.err  {background:#f3f4f6;         color:var(--t3);}
  .upd{font-size:10px; color:var(--t3); font-weight:700; white-space:nowrap;}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .tile{
    background:var(--tile); border-radius:10px; padding:7px 6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-width:0;
  }
  .tile .lab{font-size:9px; color:var(--t3); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .tile .val{font-size:clamp(12px,3.4vw,15px); font-weight:900; line-height:1; white-space:nowrap; color:var(--t1);}
  .tile .val.sm{font-size:clamp(11px,3vw,13px);}
</style>
</head>
<body id="body">
  <div class="wrap">
    <div class="head">
      <span id="mode" class="mode err"><span id="mtxt">불러오는 중</span><span class="sub" id="msub"></span></span>
      <span class="upd" id="upd">–</span>
    </div>
    <div class="grid">
      <div class="tile"><div class="lab">QLD 이격</div><div class="val" id="gapQ">–</div></div>
      <div class="tile"><div class="lab">SSO 이격</div><div class="val" id="gapS">–</div></div>
      <div class="tile"><div class="lab">과열</div><div class="val" id="heat">–</div></div>
      <div class="tile"><div class="lab">공포탐욕</div><div class="val sm" id="fg">–</div></div>
      <div class="tile"><div class="lab">VIX</div><div class="val" id="vix">–</div></div>
      <div class="tile"><div class="lab" id="thirdLab">대기</div><div class="val" id="third">–</div></div>
      <div class="tile"><div class="lab">TQQQ 특공</div><div class="val sm" id="tq">–</div></div>
      <div class="tile"><div class="lab">SOXL 특공</div><div class="val sm" id="sx">–</div></div>
    </div>
  </div>

<script>
// ── 설정: 이 두 값만 맞으면 됩니다 ──
const GAS_URL  = "https://script.google.com/macros/s/AKfycbxhYlpp3Iq-iK-84cejY2uMIU6IybsgRlJ-SNx16OmmTPc4i4fBF8QFjYZURwV4hnpItA/exec";
const DASH_URL = "https://qld-dashboard.pages.dev";   // ← 전체 대시보드 주소(다르면 수정)
const CACHE_KEY = "qld_widget_cache_v2";

document.getElementById("body").addEventListener("click", () => {
  try { window.location.href = DASH_URL; } catch(e) {}
});

const $ = id => document.getElementById(id);

async function getJSON(url){
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), 10000);
  try{
    const r = await fetch(url, { method:"GET", mode:"cors", redirect:"follow", signal:ctrl.signal });
    clearTimeout(to);
    return await r.json();
  }catch(e){ clearTimeout(to); return null; }
}

function daysSince(iso){
  if(!iso) return null;
  const p = String(iso).split("-").map(Number);
  if(p.length<3) return null;
  const d0 = new Date(p[0], p[1]-1, p[2]);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((today - d0)/86400000));
}
function heatTag(dev, chg20){
  if(dev==null && chg20==null) return "–";
  const devHot=dev!=null&&dev>=8, devExt=dev!=null&&dev>=12, brWeak=chg20!=null&&chg20<=-2;
  let e = "🟢";
  if(devExt || (devHot&&brWeak)) e = "🔴";
  else if(devHot || brWeak)      e = "🟡";
  return dev!=null ? `${e} ${dev>=0?"+":""}${dev}%` : e;
}
function fgLabel(v){
  if(v==null) return "–";
  let l="중립";
  if(v<25) l="극공"; else if(v<45) l="공포"; else if(v<55) l="중립"; else if(v<75) l="탐욕"; else l="극탐";
  return v + " " + l;
}
function tuggun(price, ma){
  if(price==null || ma==null) return "–";
  const gap = (price-ma)/ma*100;
  return (price<ma ? "🔔 " : "") + (gap>=0?"+":"") + gap.toFixed(1) + "%";
}
function gapPct(p, ma){ return (p==null||ma==null) ? null : (p-ma)/ma*100; }
function hhmm(t){ return String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0"); }

// main 데이터로 대부분 타일 그리기 (fetch 1개면 됨)
function renderMain(main){
  const qld=main.qld, ma120=main.ma120, sso=main.sso, ma120sso=main.ma120sso;
  const belowQLD = (qld!=null && ma120!=null && qld < ma120);
  const ssoConfirmed = (sso!=null && ma120sso!=null && sso < ma120sso);
  let cls, mtxt, msub, thirdLab, thirdVal;
  if(!belowQLD){
    cls="hold"; mtxt="홀드"; msub="대기모드";
    const dd = daysSince(main.standbyDate);
    thirdLab="대기"; thirdVal = dd!=null ? dd+"일" : "–";
  } else if(ssoConfirmed){
    cls="buy"; mtxt="매수"; msub="찐웅덩이"; thirdLab="상태"; thirdVal="진행중";
  } else {
    cls="watch"; mtxt="관찰"; msub="매수대기"; thirdLab="상태"; thirdVal="미확정";
  }
  $("mode").className = "mode " + cls;
  $("mtxt").textContent = mtxt;
  $("msub").textContent = msub;
  $("thirdLab").textContent = thirdLab;
  $("third").textContent = thirdVal;

  const gQ = gapPct(qld, ma120);
  if(gQ!=null){ $("gapQ").textContent=(gQ>=0?"+":"")+gQ.toFixed(1)+"%"; $("gapQ").style.color = gQ>=0?"var(--t1)":"var(--blue)"; }
  const gS = gapPct(sso, ma120sso);
  if(gS!=null){ $("gapS").textContent=(gS>=0?"+":"")+gS.toFixed(1)+"%"; $("gapS").style.color = gS>=0?"var(--t1)":"var(--blue)"; }
  $("fg").textContent  = fgLabel(main.fg);
  $("vix").textContent = (main.vix!=null) ? Number(main.vix).toFixed(1) : "–";
  $("tq").textContent = tuggun(main.tqqq, main.ma200tqqq);
  $("sx").textContent = tuggun(main.soxl, main.ma300soxl);
}
function renderHeat(devVal, chg20){ $("heat").textContent = heatTag(devVal, chg20); }
function renderStamp(t){ $("upd").textContent = "갱신 " + hhmm(t); }

// 캐시 스냅샷 적용 (열자마자 즉시 그림 → "불러오는 중" 안 뜸)
function applySnapshot(s){
  if(!s || !s.main) return;
  try{
    renderMain(s.main);
    renderHeat(s.devVal, s.chg20);
    if(s.time) renderStamp(new Date(s.time));
  }catch(e){}
}
function loadCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){ return null; } }
function saveCache(s){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(s)); }catch(e){} }

// 시작하자마자 캐시부터 그린다
const cached = loadCache();
if(cached) applySnapshot(cached);

async function load(){
  // 1) main 먼저 — 대부분 타일이 여기서 채워짐
  const main = await getJSON(GAS_URL);
  if(!main || main.qld==null){
    // 실패해도 캐시가 있으면 그대로 유지, 없을 때만 실패 표시
    if(!cached){
      $("mode").className = "mode err";
      $("mtxt").textContent = "연결 실패";
      $("msub").textContent = "";
      $("upd").textContent = "탭하여 열기";
    }
    return;
  }
  renderMain(main);
  renderStamp(new Date());
  let snap = { main, devVal:null, chg20:null, time: Date.now() };
  saveCache(snap);

  // 2) 과열(QQQ 이격 + 시장폭)은 뒤이어 채움
  const [dev, br] = await Promise.all([
    getJSON(`${GAS_URL}?action=dev&ticker=QQQ&period=200`),
    getJSON(`${GAS_URL}?action=breadth`)
  ]);
  const devVal = (dev && dev.ok) ? dev.dev : null;
  const chg20  = (br && br.ok)  ? br.chg20 : null;
  renderHeat(devVal, chg20);
  snap.devVal = devVal; snap.chg20 = chg20; snap.time = Date.now();
  saveCache(snap);
}

load();
setInterval(load, 5*60*1000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
</script>
</body>
</html>

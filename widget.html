<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QLD 위젯</title>
<style>
  :root{
    --card:#ffffff; --border:#e5e7eb;
    --t1:#111827; --t2:#4b5563; --t3:#9ca3af;
    --blue:#2563eb; --blue-lt:#eff4ff;
    --green:#059669; --green-lt:#ecfdf5;
    --amber:#d97706; --amber-lt:#fffbeb;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,'Noto Sans KR',Roboto,sans-serif;
    background:transparent; color:var(--t1);
    display:flex; padding:6px; cursor:pointer; user-select:none;
  }
  .bar{
    flex:1; display:flex; align-items:stretch; gap:0;
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; box-shadow:0 3px 12px rgba(0,0,0,0.06);
    overflow:hidden;
  }
  .mode{
    display:flex; flex-direction:column; justify-content:center;
    padding:0 14px; min-width:96px; gap:2px;
  }
  .mode .m-txt{font-size:clamp(14px,4.4vw,18px); font-weight:900; line-height:1.05; white-space:nowrap;}
  .mode .m-sub{font-size:10px; font-weight:700; opacity:.75; white-space:nowrap;}
  .mode.hold {background:var(--blue-lt);  color:var(--blue);}
  .mode.buy  {background:var(--green-lt); color:var(--green);}
  .mode.watch{background:var(--amber-lt); color:var(--amber);}
  .mode.err  {background:#f3f4f6;         color:var(--t3);}
  .cells{flex:1; display:flex; align-items:center;}
  .cell{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:0 4px; min-width:0; border-left:1px solid var(--border);
  }
  .cell .lab{font-size:9px; color:var(--t3); font-weight:700; white-space:nowrap;}
  .cell .val{font-size:clamp(13px,4vw,17px); font-weight:900; line-height:1; white-space:nowrap; color:var(--t1);}
  .stamp{
    display:flex; align-items:center; padding:0 10px 0 8px;
    border-left:1px solid var(--border);
    font-size:9px; color:var(--t3); font-weight:700; white-space:nowrap;
  }
</style>
</head>
<body id="body">
  <div class="bar">
    <div id="mode" class="mode err">
      <div class="m-txt" id="mtxt">…</div>
      <div class="m-sub" id="msub">불러오는 중</div>
    </div>
    <div class="cells">
      <div class="cell">
        <div class="lab">이격</div>
        <div class="val" id="gap">–</div>
      </div>
      <div class="cell">
        <div class="lab">과열</div>
        <div class="val" id="heat">–</div>
      </div>
      <div class="cell">
        <div class="lab" id="thirdLab">대기</div>
        <div class="val" id="third">–</div>
      </div>
    </div>
    <div class="stamp" id="stamp">–</div>
  </div>

<script>
// ── 설정: 이 두 값만 맞으면 됩니다 ──
const GAS_URL  = "https://script.google.com/macros/s/AKfycbxhYlpp3Iq-iK-84cejY2uMIU6IybsgRlJ-SNx16OmmTPc4i4fBF8QFjYZURwV4hnpItA/exec";
const DASH_URL = "https://qld-dashboard.pages.dev";   // ← 전체 대시보드 주소(다르면 수정)

document.getElementById("body").addEventListener("click", () => {
  try { window.location.href = DASH_URL; } catch(e) {}
});

const $ = id => document.getElementById(id);

async function getJSON(url){
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), 12000);
  try{
    const r = await fetch(url, { method:"GET", mode:"cors", redirect:"follow", signal:ctrl.signal });
    clearTimeout(to);
    return await r.json();
  }catch(e){ clearTimeout(to); return null; }
}

function daysSince(iso){
  if(!iso) return null;
  const p = String(iso).split("-").map(Number);
  if(p.length<3) return null;
  const d0 = new Date(p[0], p[1]-1, p[2]);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((today - d0)/86400000));
}

function heatTag(dev, chg20){
  if(dev==null && chg20==null) return "–";
  const devHot=dev!=null&&dev>=8, devExt=dev!=null&&dev>=12, brWeak=chg20!=null&&chg20<=-2;
  if(devExt || (devHot&&brWeak)) return "🔴";
  if(devHot || brWeak)           return "🟡";
  return "🟢";
}

async function load(){
  const [main, dev, br] = await Promise.all([
    getJSON(GAS_URL),
    getJSON(`${GAS_URL}?action=dev&ticker=QQQ&period=200`),
    getJSON(`${GAS_URL}?action=breadth`)
  ]);

  if(!main || main.qld==null){
    $("mode").className = "mode err";
    $("mtxt").textContent = "연결 실패";
    $("msub").textContent = "탭하여 열기";
    return;
  }

  const qld = main.qld, ma120 = main.ma120, sso = main.sso, ma120sso = main.ma120sso;
  const belowQLD = (qld!=null && ma120!=null && qld < ma120);
  const ssoConfirmed = (sso!=null && ma120sso!=null && sso < ma120sso);

  let cls, mtxt, msub, thirdLab, thirdVal;
  if(!belowQLD){
    cls="hold"; mtxt="홀드"; msub="대기모드";
    const dd = daysSince(main.standbyDate);
    thirdLab="대기"; thirdVal = dd!=null ? dd+"일" : "–";
  } else if(ssoConfirmed){
    cls="buy"; mtxt="매수"; msub="찐웅덩이";
    thirdLab="상태"; thirdVal="진행";
  } else {
    cls="watch"; mtxt="관찰"; msub="매수대기";
    thirdLab="상태"; thirdVal="미확정";
  }
  $("mode").className = "mode " + cls;
  $("mtxt").textContent = mtxt;
  $("msub").textContent = msub;
  $("thirdLab").textContent = thirdLab;
  $("third").textContent = thirdVal;

  if(qld!=null && ma120!=null){
    const gap = (qld-ma120)/ma120*100;
    $("gap").textContent = (gap>=0?"+":"") + gap.toFixed(1) + "%";
    $("gap").style.color = gap>=0 ? "var(--t1)" : "var(--blue)";
  } else $("gap").textContent = "–";

  const devVal = (dev && dev.ok) ? dev.dev : null;
  const chg20  = (br && br.ok)  ? br.chg20 : null;
  $("heat").textContent = heatTag(devVal, chg20);

  const now = new Date();
  $("stamp").textContent = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
}

load();
setInterval(load, 5*60*1000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
</script>
</body>
</html>
